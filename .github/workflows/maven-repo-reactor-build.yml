name: Run Maven build of all components

on:
  schedule:
    # only runs on the main branch (see below)
    - cron: '0 3 * * *'
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to initialize repo with (use default branch if empty)'
        required: false
        default: ''

permissions:
  packages: read
  issues: read
  pull-requests: read
  
jobs:
  maven-reactor-build:
    # Run the job if:
    # - It's triggered via schedule, only if on the main branch
    # - Or if it's triggered by a push (any branch) or workflow_dispatch (any branch)
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/main' }}
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        distribution: [ 'zulu' ]
        jdk: [ '21' ] # [ '11', '17', ]
        maven-version: [ '3.9.11' ] # , '4.0.0-rc-4' ]

    env:
      BRANCH: "${{ github.event.inputs.branch || github.ref_name }}"
      GITHUB_ORGANIZATION: "${{ github.repository_owner }}"
      GITHUB_LOGIN: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_OAUTH: ${{ github.token }}

    steps:
      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-version: ${{ matrix.jdk }}
          java-distribution: ${{ matrix.distribution }}
          maven-version: ${{ matrix.maven-version }}

      - name: Show current Maven version
        run: mvn --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify npm installation
        run: npm --version

      - name: Install repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y repo

      - name: Initialize repo
        run: ./bin/repo-start

      - name: Switch to special branches
        run: ./bin/repo-checkout-specific-branches

      - name: Build with Maven
        env:
          USE_DEVELOCITY: true
          PREVIEW_LOGLINES: 50
        run: ./bin/run-maven clean install -fae -Dsurefire.rerunFailingTestsCount=2 2>&1 | tee logs/maven-log

      - name: Run jQAssistant Scan
        env:
          USE_DEVELOCITY: true
          PREVIEW_LOGLINES: 50
        run: ./bin/run-jqa scan 2>&1 | tee logs/jqa-scan.log

      - name: Run jQAssistant GitHub Scan
        env:
          USE_DEVELOCITY: true
          PREVIEW_LOGLINES: 50
        run: ./bin/run-jqa github 2>&1 | tee logs/jqa-github.log

      - name: Upload jqassistant/store artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jqassistant-store
          path: jqassistant/store

      - name: Collect Git status and environment
        if: always()
        run: |
          (
            echo "Git:"
            git status
            echo "Env:"
            env | sort
            echo "PWD:"
            pwd
          ) 2>&1 | tee logs/env.log 

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-Maven-${{ matrix.maven-version }}@JDK-${{ matrix.jdk }}-${{ matrix.distribution }}
          path: logs

